name: Defineciler işaret görselleri (Gemini)

# Define işaretleri için fotoğraf gerçekçiliğinde görseller üretir ve dala kaydeder.
# Tetikleme: .github/sign-images-request dosyasına mod yazıp gönderin (probe | all | id1,id2)
# ya da (ana dalda) elle çalıştırın.
on:
  push:
    paths:
      - '.github/sign-images-request'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (tek görsel dener), all (hepsi) ya da virgülle kimlikler'
        default: probe
      model:
        description: 'İsteğe bağlı model adı'
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --prefix .github/scripts sharp@0.34.5
      - name: Modu belirle
        id: mode
        run: |
          mode="${{ inputs.mode }}"
          [ -z "$mode" ] && mode=$(awk 'NR==1{print $1}' .github/sign-images-request)
          echo "mode=${mode:-probe}" >> "$GITHUB_OUTPUT"
          echo "Mod: ${mode:-probe}"
      - name: Geçici görsel Worker'ını yayınla (Cloudflare Workers AI)
        id: cf
        working-directory: .github/imagegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -n "$ACCT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCT"; fi
          key=$(openssl rand -hex 16)
          echo "::add-mask::$key"
          cat > wrangler.jsonc <<CFG
          { "name": "defineciler-imagegen", "main": "index.js", "compatibility_date": "2026-09-01",
            "workers_dev": true, "ai": { "binding": "AI" }, "vars": { "KEY": "$key" } }
          CFG
          npx -y wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          # Yeni workers.dev adresi birkaç dakikada yayılır; Worker'ımız 403 dönene kadar bekle.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            echo "deneme $i: HTTP $code"
            [ "$code" = "403" ] && break
            sleep 10
          done
      - name: Görselleri üret
        env:
          CF_IMAGE_URL: ${{ steps.cf.outputs.url }}
          CF_IMAGE_KEY: ${{ steps.cf.outputs.key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_MODEL: ${{ inputs.model }}
          NODE_PATH: ${{ github.workspace }}/.github/scripts/node_modules
        run: node --experimental-strip-types .github/scripts/gen-sign-images.mjs "${{ steps.mode.outputs.mode }}"
      - name: Geçici Worker'ı sil
        if: always() && steps.cf.outputs.url != ''
        working-directory: .github/imagegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCT"; fi
          npx -y wrangler@4 delete --force || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-images
          path: defineciler/assets/signs
          if-no-files-found: ignore
      - name: Dala kaydet
        if: steps.mode.outputs.mode != 'probe'
        run: |
          git add defineciler/assets/signs
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "İşaretler: Gemini ile üretilen görseller"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
