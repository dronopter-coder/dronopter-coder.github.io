name: Defineciler Gemini kontrolü

# Sunucunun kullandığı Gemini modellerini küçük bir istekle sınar; "analiz servisi çok yoğun" hatasının
# nedenini (kota, model adı, geçici yoğunluk) iş özetinde gösterir. Gerekli secret: GEMINI_API_KEY
on:
  push:
    paths:
      - '.github/scripts/gemini-check.mjs'
      - '.github/scripts/bench-gemini.mts'
      - '.github/scripts/fixtures/**'
      - '.github/workflows/defineciler-gemini-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gemini modellerini sına
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret'ı yok."
            exit 1
          fi
          node .github/scripts/gemini-check.mjs
      - name: Gerçek fotoğrafla model karşılaştırması (süre ve kullanılabilirlik)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          {
            echo '### Fotoğraflı analiz denemesi (aynı anda, yapılandırılmış çıktı)'
            echo '```'
            node --experimental-strip-types .github/scripts/bench-gemini.mts .github/scripts/fixtures/sikke.jpg \
              gemini-3.5-flash gemini-3.8-flash gemini-flash-lite-latest gemini-flash-latest \
              gemini-2.5-flash gemini-2.5-flash-lite gemini-3.1-flash-lite gemini-3.5-flash-lite \
              gemini-3.6-flash gemini-3.7-flash gemini-3-flash-preview | sort -k2,2 -s
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
