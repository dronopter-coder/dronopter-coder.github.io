name: Defineciler sunucu testi

# Yayındaki Worker'a gerçek bir analiz ve haber isteği gönderir (APK derlemesini tetiklemez).
on:
  push:
    paths:
      - '.github/workflows/defineciler-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.DEFINECILER_API_URL || 'https://defineciler-api.dronopter.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Sağlık
        run: curl -fsS "$API/health"
      - name: Gemini anahtarı ve model kontrolü (doğrudan)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -o models.json -w 'models HTTP %{http_code}\n'
          python3 -c "import json; d=json.load(open('models.json')); print(d.get('error') or [m['name'] for m in d.get('models', []) if 'flash' in m['name']])"
          for m in gemini-flash-latest gemini-3.8-flash gemini-2.5-flash; do
            code=$(curl -sS -o gen.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Sadece OK yaz."}]}]}')
            echo "$m → HTTP $code: $(python3 -c "import json; d=json.load(open('gen.json')); print((d.get('error') or {}).get('message') or d['candidates'][0]['content']['parts'][-1].get('text','')[:80])")"
          done
      - name: Analiz (örnek görsel)
        run: |
          python3 - <<'PY'
          import base64, json
          img = base64.b64encode(open('defineciler/assets/images/icon.png', 'rb').read()).decode()
          json.dump({"image": img, "mimeType": "image/png", "note": "Test: uygulama simgesi"}, open('body.json', 'w'))
          PY
          code=$(curl -sS -o res.json -w '%{http_code}' -X POST "$API/analyze" \
            -H 'Content-Type: application/json' -H 'X-App-Key: defineciler-android-v1' --data @body.json)
          echo "HTTP $code"
          python3 -c "import json; r=json.load(open('res.json')); print(json.dumps(r, ensure_ascii=False, indent=2)[:1500])"
          test "$code" = "200"
      - name: Haberler (sunucu yedeği)
        run: |
          curl -sS "$API/news" -o news.json -w 'HTTP %{http_code}\n'
          python3 -c "import json; d=json.load(open('news.json')); items=d.get('items', []); print(len(items), 'haber'); [print('-', i['source'], '|', i['title'][:90]) for i in items[:5]]"
