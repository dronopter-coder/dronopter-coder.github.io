name: Defineciler sunucu testi

# Yayındaki Worker'a gerçek bir analiz ve haber isteği gönderir (APK derlemesini tetiklemez).
on:
  push:
    paths:
      - '.github/workflows/defineciler-smoke.yml'
      - 'defineciler/src/services/news-image-core.ts'
      - 'defineciler/scripts/test-news-images.mts'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.DEFINECILER_API_URL || 'https://defineciler-api.dronopter.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Sağlık
        run: curl -fsS "$API/health"
      - name: Gemini anahtarı ve model kontrolü (doğrudan)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sS -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -o models.json -w 'models HTTP %{http_code}\n'
          python3 -c "import json; d=json.load(open('models.json')); print(d.get('error') or [m['name'] for m in d.get('models', []) if 'flash' in m['name']])"
          for m in gemini-flash-latest gemini-3.8-flash gemini-2.5-flash; do
            code=$(curl -sS -o gen.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Sadece OK yaz."}]}]}')
            echo "$m → HTTP $code: $(python3 -c "import json; d=json.load(open('gen.json')); print((d.get('error') or {}).get('message') or d['candidates'][0]['content']['parts'][-1].get('text','')[:80])")"
          done
      - name: Analiz (örnek görsel)
        run: |
          python3 - <<'PY'
          import base64, json
          img = base64.b64encode(open('defineciler/assets/images/home-hero.jpg', 'rb').read()).decode()
          json.dump({"image": img, "mimeType": "image/jpeg", "note": "Test: gerçek boyutlu sikke fotoğrafı"}, open('body.json', 'w'))
          PY
          out=$(curl -sS -o res.json -w '%{http_code} %{time_total}' --max-time 120 -X POST "$API/analyze" \
            -H 'Content-Type: application/json' -H 'X-App-Key: defineciler-android-v1' --data @body.json || echo "000 -")
          code=${out%% *}
          echo "HTTP $code · toplam süre ${out#* } sn" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import json; r=json.load(open('res.json')); print(json.dumps(r, ensure_ascii=False, indent=2)[:1500])"
          test "$code" = "200"
          # Aynı fotoğraf ikinci kez: önbellekten (model "cache") ve hızlı gelmeli
          out2=$(curl -sS -o res2.json -w '%{http_code} %{time_total}' --max-time 120 -X POST "$API/analyze" \
            -H 'Content-Type: application/json' -H 'X-App-Key: defineciler-android-v1' \
            -H 'X-Device-Id: smoke-test-device-0001' --data @body.json || echo "000 -")
          echo "2. istek: HTTP ${out2%% *} · süre ${out2#* } sn · model: $(python3 -c "import json; print(json.load(open('res2.json')).get('model'))")" | tee -a "$GITHUB_STEP_SUMMARY"
      # Ücretsiz katman kotasını harcamamak için yalnızca elle çalıştırıldığında
      - name: Model hız testi (gerçek fotoğraf, doğrudan Gemini)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --experimental-strip-types .github/scripts/bench-gemini.mts defineciler/assets/images/home-hero.jpg \
            gemini-3.8-flash gemini-flash-latest gemini-3.7-flash gemini-3.5-flash gemini-flash-lite-latest gemini-2.5-flash
      - name: Haberler (sunucu yedeği)
        run: |
          curl -sS "$API/news" -o news.json -w 'HTTP %{http_code}\n'
          python3 -c "import json; d=json.load(open('news.json')); items=d.get('items', []); print(len(items), 'haber'); [print('-', i['source'], '|', i['title'][:90]) for i in items[:5]]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Haber görselleri (Google Haberler adres çözme + og:image)
        working-directory: defineciler
        run: node --experimental-strip-types scripts/test-news-images.mts --live
