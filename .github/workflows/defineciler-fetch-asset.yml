name: Defineciler varlık indir

# Verilen adres(ler)den bir görseli indirip dala kaydeder (ör. Canva'da üretilen görseller).
# Adresler boşlukla ayrılır; ilk başarılı ve en büyük dosya kullanılır.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'İndirilecek adres(ler), boşlukla ayrılmış'
        required: true
      out:
        description: 'Repo içi hedef yol (ör. defineciler/assets/hero/canva-hero.jpg)'
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: İndir
        env:
          URLS: ${{ github.event.inputs.urls }}
          OUT: ${{ github.event.inputs.out }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          best=0; i=0
          for u in $URLS; do
            i=$((i+1))
            code=$(curl -sSL -A 'Mozilla/5.0' -o "cand-$i" -w '%{http_code}' "$u" || echo 000)
            size=$(stat -c %s "cand-$i" 2>/dev/null || echo 0)
            dims=$(identify -format '%wx%h' "cand-$i" 2>/dev/null || echo '-')
            echo "aday $i: HTTP $code, $size bayt, $dims"
            if [ "$code" = "200" ] && [ "$dims" != "-" ] && [ "$size" -gt "$best" ]; then best=$size; cp "cand-$i" "$OUT"; fi
          done
          test -f "$OUT"
          identify "$OUT"
      - name: Dala kaydet
        env:
          OUT: ${{ github.event.inputs.out }}
        run: |
          git add "$OUT"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Varlık: $(basename "$OUT")"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
